@if (recipe(); as r) {
  <app-return-back />
  <article class="recipe">
    <div class="hero">
      <img [src]="r.image" [alt]="r.name" />
      <div class="hero__overlay">
        <h1>{{ r.name }}</h1>
        <div class="tags">
          <span class="tag">{{ r.cuisine }}</span>
          <span class="tag">{{ r.difficulty }}</span>
          <span class="tag">{{ r.prepTimeMinutes }} min</span>
        </div>
      </div>
    </div>

    <div class="body">
      <aside class="ingredients">
        <div class="ing-header">
          <h2>Ingredients</h2>
          <label>
            <input 
              type="checkbox"
              [checked]="checkedAll()"
              (change)="toggleAllIngredients()"
            />
            <span>Check all</span>
          </label>
        </div>
        <ul>
          @for (i of r.ingredients; track i) {
            <li>
              <label [class.done]="checked().has(i)">
                <input 
                  type="checkbox"
                  [checked]="checked().has(i)"
                  (change)="toggleIngredient(i)"
                />
                <span>{{ i }}</span>
              </label>
            </li>
          }
        </ul>
      </aside>

      <section class="steps">
        <h2>Instructions</h2>
        <ol>
          @for (s of r.instructions; track s; let idx = $index) {
            <li><span class="step-num">{{ idx + 1 }}</span>{{ s }}</li>
          }
        </ol>
      </section>
    </div>
  </article>
} @else {
  <p class="loading">Загрузка...</p>
}
